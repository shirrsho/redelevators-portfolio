name: Build, Test & Deploy

# Production is the Hostinger Docker Manager project "redelevators-portfolio" in
# /docker/redelevators-portfolio on the Advergo VPS. This workflow checks the app, builds the
# image, pushes it to Docker Hub, copies docker-compose.prod.yml there as docker-compose.yml with
# the image pinned to this exact build, and restarts it. It never writes the server's .env:
# settings live in the panel's Environment box.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: itzwasik/redelevators-portfolio
  PROJECT_DIR: /docker/redelevators-portfolio
  HEALTH_URL: http://127.0.0.1:6001/

jobs:
  # ---------------------------------------------------------------------
  # 1. Build & test the Next.js app itself (no Docker involved yet).
  #    There is no test script in package.json yet — lint + a production
  #    build act as the verification gate. Swap/add `npm test` here once
  #    a test suite exists.
  # ---------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Same as the Docker build below, so this check builds what ships.
          NEXT_PUBLIC_ASSISTANT_URL: ${{ vars.NEXT_PUBLIC_ASSISTANT_URL }}

  # ---------------------------------------------------------------------
  # 2. Build the production Docker image and push it to Docker Hub.
  # ---------------------------------------------------------------------
  docker:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tag
        id: vars
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The website assistant: set the repository variable NEXT_PUBLIC_ASSISTANT_URL (Settings → Secrets and
          # variables → Actions → Variables) to switch it on. Unset or empty = off. Changing it needs a new deploy.
          build-args: |
            NEXT_PUBLIC_ASSISTANT_URL=${{ vars.NEXT_PUBLIC_ASSISTANT_URL }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------
  # 3. Copy the pinned compose file and ops/deploy.sh to the VPS and run
  #    it there (pull, restart, wait until healthy).
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: docker
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The server's compose file names the exact build, so the panel shows what is running and a
      # rollback is just the previous tag.
      - name: Prepare the release files
        env:
          TAG: ${{ needs.docker.outputs.tag }}
        run: |
          mkdir -p out
          sed "s#^\([[:space:]]*image: ${IMAGE}:\).*#\1${TAG}#" docker-compose.prod.yml > out/docker-compose.yml
          grep -q "image: ${IMAGE}:${TAG}" out/docker-compose.yml
          cp ops/deploy.sh out/

      # Connections from GitHub to the VPS occasionally time out; wait for SSH to answer instead of
      # failing the deploy on a network blip.
      - name: Wait for SSH on the VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          for _ in $(seq 1 12); do
            if timeout 10 bash -c "exec 3<>/dev/tcp/$HOST/$PORT" 2>/dev/null; then echo "SSH reachable"; exit 0; fi
            sleep 10
          done
          echo "::error::the VPS did not accept connections on its SSH port for 2 minutes"; exit 1

      - name: Copy the release files to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "out/docker-compose.yml,out/deploy.sh"
          target: /tmp/redelevators-portfolio-release
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_SSH_PORT }}
          username: ${{ secrets.VPS_SSH_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The action reports only the last command's exit status, so keep deploy.sh's and exit
          # with it after cleaning up; otherwise a failed deploy shows as a success.
          script: |
            bash /tmp/redelevators-portfolio-release/deploy.sh ${{ env.PROJECT_DIR }} \
              /tmp/redelevators-portfolio-release/docker-compose.yml \
              ${{ needs.docker.outputs.tag }} ${{ env.HEALTH_URL }}
            rc=$?
            rm -rf /tmp/redelevators-portfolio-release
            exit $rc
